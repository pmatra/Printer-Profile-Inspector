name: macOS builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            target: arm64
          - runner: macos-15-intel
            architecture: x64
            target: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: requirements-macos.txt
      - name: Install native Mac dependencies
        run: python -m pip install -r requirements-macos.txt -r requirements-dev.txt
      - name: Check architecture and Tcl/Tk
        run: |
          python -c "import platform,tkinter; assert platform.machine() == '${{ matrix.target }}'; root=tkinter.Tk(); root.update(); root.destroy()"
      - name: Lint
        run: python -m ruff check .
      - name: Native macOS platform checks
        timeout-minutes: 4
        run: python check_platform.py
      - name: Profile/category regression checks
        run: python check_categories.py
      - name: Adversarial-review regressions
        run: python check_adversarial.py
      - name: Build and smoke-test app bundle
        run: python build_macos.py
      - uses: actions/upload-artifact@v6
        with:
          name: macOS-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/macos/*.zip
            dist/macos/SHA256SUMS.txt
            dist/macos/packaged-check.json
            dist/macos/README-macOS.txt
