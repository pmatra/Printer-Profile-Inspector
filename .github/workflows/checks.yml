name: Windows regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.4'
          cache: pip
      - name: Install tested dependencies and lint tool
        run: python -m pip install -r requirements-lock.txt -r requirements-dev.txt
      - name: Catch syntax and undefined-name errors
        run: python -m ruff check .
      - name: Application checks
        run: python check_inspector.py
      - name: Category interaction checks
        run: python check_categories.py
      - name: Settings and upgrade checks
        run: python check_upgrade.py
      - name: Adversarial-review regressions
        run: python check_adversarial.py
      - name: Platform dispatch checks
        run: python check_platform.py
      - name: Update and UI regression checks
        run: python check_updates.py
      - name: Build Windows installer
        run: |
          $compiler = & ./installer/get-compiler.ps1 -Destination "$env:RUNNER_TEMP/inno-sdk"
          ./build-installer.ps1 -Compiler $compiler
      - name: Install, smoke-check and uninstall isolated test copy
        run: |
          ./installer/check-install.ps1 -Installer (Get-ChildItem dist/installer/*-x64.exe).FullName -VerifyPreservedShortcuts
          ./installer/check-install.ps1 -Installer (Get-ChildItem dist/installer/*-x64.exe).FullName -TestShortcuts
      - uses: actions/upload-artifact@v6
        with:
          name: Windows-installer
          path: dist/installer/*-x64.exe
          if-no-files-found: error
      # Hosted Windows VMs may expose software OpenGL only. Hardware pixel tests
      # remain a required manual release check on a real GPU, not a skipped pass.
